# GeneMolX WGS pipeline environment
# Create:  mamba env create -f environment.yml
# Recommended before creating: conda config --set channel_priority strict

name: genemolx-wgs
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - openjdk=17.0.17
  - trimmomatic=0.39
  - fastqc=0.12.1
  - multiqc=1.35
  - bwa=0.7.18
  - samtools=1.23.1
  - bcftools=1.23.1
  - htslib=1.23.1
  - gatk4=4.6.2.0
  - verifybamid2=2.0.2
  - mawk=1.3.4
  - r-base=4.4.3
  - curl=8.22.0
  - unzip=6.0
  - bzip2=1.0.8
